<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>がんセンター新潟病院図書室 スマホ貸出</title>
    <style>
        body {
            font-family: 'Noto Sans JP', 'Helvetica Neue', Arial, sans-serif;
            background-color: #f0f7f4;
            color: #2c3e50;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            background: #ffffff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 450px;
            box-sizing: border-box;
        }
        h2 {
            color: #2e7d32;
            text-align: center;
            font-size: 1.4rem;
            margin-top: 0;
        }
        p.desc {
            font-size: 0.95rem;
            color: #555;
            text-align: center;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 18px;
        }
        label {
            display: block;
            font-weight: bold;
            font-size: 1rem;
            margin-bottom: 6px;
            color: #333;
        }
        input, select {
            width: 100%;
            padding: 12px;
            font-size: 1.1rem;
            border: 2px solid #c8e6c9;
            border-radius: 8px;
            box-sizing: border-box;
            background-color: #fafafa;
        }
        input:focus {
            border-color: #4caf50;
            outline: none;
            background-color: #fff;
        }
        button {
            width: 100%;
            padding: 14px;
            font-size: 1.2rem;
            font-weight: bold;
            color: white;
            background-color: #4caf50;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            transition: background 0.2s;
        }
        button:hover {
            background-color: #388e3c;
        }
        .secondary-btn {
            background-color: #ff9800;
            margin-top: 10px;
        }
        .secondary-btn:hover {
            background-color: #f57c00;
        }
        
        /* カメラ描画エリア ＆ 照準フレームのスタイリング */
        #interactive {
            position: relative;
            width: 100%;
            height: 240px; 
            margin-bottom: 15px;
            border-radius: 8px;
            overflow: hidden;
            display: none;
            background: #000;
        }
        #interactive video, #interactive canvas {
            width: 100% !important;
            height: 100% !important;
            object-fit: cover;
        }
        #interactive canvas.drawing, #interactive canvas.drawingBuffer {
            position: absolute;
            top: 0;
            left: 0;
        }
        /* 中央の照準枠（ガイド） */
        .scanner-guide {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80%;
            height: 80px;
            border: 2px dashed #ff5252;
            box-shadow: 0 0 0 1000px rgba(0, 0, 0, 0.4); /* 周囲を少し暗くしてバーコードを際立たせる */
            pointer-events: none;
            z-index: 10;
            border-radius: 4px;
        }
        .scanner-guide-text {
            position: absolute;
            bottom: 10px;
            width: 100%;
            text-align: center;
            color: #fff;
            font-size: 0.8rem;
            text-shadow: 0 1px 2px rgba(0,0,0,0.8);
            z-index: 11;
            pointer-events: none;
        }

        .hidden {
            display: none !important;
        }
        .success-box {
            text-align: center;
            padding: 20px 0;
        }
        .success-box h3 {
            color: #2e7d32;
            font-size: 1.5rem;
        }
    </style>
    <!-- バーコード読み取りライブラリ (QuaggaJS) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/quagga/0.12.1/quagga.min.js"></script>
</head>
<body>

<div class="container" id="main-container">
    <h2><b>がんセンター新潟病院図書室</b></h2>
    <p class="desc">📖バーコードを読み取って簡単貸出📱</p>

    <div id="form-view">
        <form id="checkout-form">
            <div class="form-group">
                <label for="shozoku">所属部署</label>
                <input type="text" id="shozoku" required placeholder="例：○○科, ○○病棟, など">
            </div>

            <div class="form-group">
                <label for="shimei">お名前</label>
                <input type="text" id="shimei" required placeholder="例：がんセン 花子">
            </div>

            <div class="form-group">
                <label for="email">メールアドレス</label>
                <input type="email" id="email" required placeholder="例：○○○○○@niigata-cc.jp">
            </div>

            <div class="form-group">
                <label for="shiryobangou">資料番号（8桁のバーコード番号）</label>
                <div style="display: flex; gap: 8px;">
                    <input type="text" id="shiryobangou" required placeholder="例：10012345" style="flex: 1;">
                    <button type="button" id="scan-btn" style="width: auto; padding: 0 15px; font-size: 0.8rem; background-color: #0288d1;">📷カメラでスキャン</button>
                </div>
                <!-- ★書名表示エリア（背景白、緑の点線、フッター並みの小さめサイズ） -->
                <div id="shomei-display" style="margin-top: 6px; padding: 6px 10px; background: #ffffff; border: 1px dashed #4caf50; border-radius: 6px; font-size: 0.75rem; color: #555; display: none;">
                    書名：未取得
                </div>
            </div>

            <!-- カメラ描画エリア ＆ 照準ガイド -->
            <div id="interactive" class="viewport">
                <div class="scanner-guide"></div>
                <div class="scanner-guide-text">枠の中にバーコードを合わせてください</div>
            </div>

            <div class="form-group">
                <label for="memo">メモ（任意）</label>
                <input type="text" id="memo" placeholder="連絡事項があれば入力してください">
            </div>

            <button type="submit" id="submit-btn">借りる！</button>
        </form>
    </div>

    <!-- 完了画面 -->
    <div id="success-view" class="success-box hidden">
        <h3>✨借用を受け付けました✨</h3>
        <p>入力したメールアドレスに控えが送信されました。</p>
        <button type="button" id="next-btn" class="secondary-btn">続けて借用する</button>
    </div>
</div>

<script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbyRS2xSD6g4bEo5FF0ZeY694szEzzj4z_mQC2PwO6Mb01F09teX1FP6R3UEMvltOLkFNg/exec";

    // 1. ローカルストレージから前回入力を復元
    window.addEventListener('DOMContentLoaded', () => {
        if (localStorage.getItem('lib_shozoku')) document.getElementById('shozoku').value = localStorage.getItem('lib_shozoku');
        if (localStorage.getItem('lib_shimei')) document.getElementById('shimei').value = localStorage.getItem('lib_shimei');
        if (localStorage.getItem('lib_email')) document.getElementById('email').value = localStorage.getItem('lib_email');
    });

    // 2. フォーム送信処理
    document.getElementById('checkout-form').addEventListener('submit', function(e) {
        e.preventDefault();

        const shozoku = document.getElementById('shozoku').value;
        const shimei = document.getElementById('shimei').value;
        const email = document.getElementById('email').value;
        const shiryobangou = document.getElementById('shiryobangou').value;
        const memo = document.getElementById('memo').value;

        localStorage.setItem('lib_shozoku', shozoku);
        localStorage.setItem('lib_shimei', shimei);
        localStorage.setItem('lib_email', email);

        const submitBtn = document.getElementById('submit-btn');
        submitBtn.disabled = true;
        submitBtn.textContent = "送信中...";

        fetch(GAS_URL, {
            method: "POST",
            mode: "no-cors",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                shozoku: shozoku,
                shimei: shimei,
                email: email,
                shiryobangou: shiryobangou,
                memo: memo
            })
        }).then(() => {
            document.getElementById('form-view').classList.add('hidden');
            document.getElementById('success-view').classList.remove('hidden');
            submitBtn.disabled = false;
            submitBtn.textContent = "借りる！";
        }).catch(error => {
            alert("送信に失敗しました。通信環境をご確認ください。");
            submitBtn.disabled = false;
            submitBtn.textContent = "借りる！";
        });
    });

    // 3. 「続けて借用する」ボタン
    document.getElementById('next-btn').addEventListener('click', function() {
        document.getElementById('shiryobangou').value = "";
        document.getElementById('memo').value = "";
        document.getElementById('shomei-display.style.display = 'none';"); // 念のため非表示化
        document.getElementById('success-view').classList.add('hidden');
        document.getElementById('form-view').classList.remove('hidden');
    });

    // 4. カメラによるバーコード読み取り (QuaggaJS連携)
    let scannerActive = false;
    document.getElementById('scan-btn').addEventListener('click', function() {
        const interactiveDiv = document.getElementById('interactive');
        const shomeiDisplay = document.getElementById('shomei-display');
        
        if (!scannerActive) {
            interactiveDiv.style.display = 'block';
            scannerActive = true;
            shomeiDisplay.style.display = 'block';
            shomeiDisplay.textContent = "📷 バーコードをスキャン中...";
            
            Quagga.init({
                inputStream : {
                    name : "Live",
                    type : "LiveStream",
                    target: interactiveDiv,
                    constraints: {
                        facingMode: "environment",
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    }
                },
                decoder : {
                    readers : [
                        "code_39_reader"
                    ]
                },
                locator: {
                    patchSize: "large",
                    halfSample: false
                },
                numOfWorkers: 2,
                locate: true
            }, function(err) {
                if (err) {
                    console.log(err);
                    alert("カメラを起動できませんでした。「許可する」を選択して再度おためしください。");
                    scannerActive = false;
                    interactiveDiv.style.display = 'none';
                    shomeiDisplay.style.display = 'none';
                    return;
                }
                Quagga.start();
            });

            Quagga.onDetected(function(result) {
                let code = result.codeResult.code;
                if(code) {
                    // 両端のアスタリスクを取り除く
                    code = code.replace(/^\*|\*$/g, '');

                    document.getElementById('shiryobangou').value = code;
                    Quagga.stop();
                    interactiveDiv.style.display = 'none';
                    scannerActive = false;
                    
                    // 読み取り成功時の表示（必要に応じて資料番号を表示）
                    shomeiDisplay.style.display = 'block';
                    shomeiDisplay.textContent = "✨ 読取成功: " + code + " （送信時にマスタから書名が反映されます）";
                }
            });
        } else {
            Quagga.stop();
            interactiveDiv.style.display = 'none';
            scannerActive = false;
            shomeiDisplay.style.display = 'none';
        }
    });
</script>

<!-- 免責事項・フッター -->
<footer style="margin-top: 40px; padding: 20px 0; text-align: center; border-top: 1px solid #eaeaea;">
  <p style="font-size: 0.75rem; color: #8c8c8c; line-height: 1.5; margin: 0;">
    ※このフォームは、司書が業務効率化のため試験的に制作したツールであり、<br>
    病院の公式Webサイトおよび図書管理システムとは一切関係ありません。
  </p>
</footer>
</body>
</html>
